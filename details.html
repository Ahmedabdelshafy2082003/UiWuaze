    <script>
    // 1. إعداد الثيم (Dark/Light Mode)
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }

    // 2. جلب البيانات من الرابط (URL Parameters) - تم إصلاح التكرار هنا
    const urlParams = new URLSearchParams(window.location.search);
    const designId = parseInt(urlParams.get('id'));
    const fromCat = urlParams.get('fromCat') || 'all';

    // 3. تحديث رابط العودة برمجياً
    const backLink = document.getElementById('back-link');
    if (designId && backLink) {
        backLink.href = `library.html?scrollTo=${designId}&cat=${fromCat}`;
    }

    // 4. جلب بيانات العنصر والناشر من ملف data.js
    const currentDesign = projectData.designs.find(d => d.id === designId);
    const currentPub = currentDesign ? projectData.publishers.find(p => p.id === currentDesign.pubId) : null;

    // دالة تهيئة الصفحة وعرض البيانات
    function initPage() {
        if (!currentDesign || !currentPub) {
            document.body.innerHTML = `<div class="flex h-screen items-center justify-center font-bold text-2xl text-slate-500">404 - Component Not Found</div>`;
            return;
        }

        // توزيع البيانات على العناصر
        document.getElementById('design-title').innerText = currentDesign.title;
        document.getElementById('design-id-display').innerText = `#DSGN-${currentDesign.id}`;
        document.getElementById('pub-name').innerText = currentPub.name;
        document.getElementById('pub-avatar').src = currentPub.avatar;

        // منطق علامة التوثيق (Verified Badge)
        const verifiedWrapper = document.getElementById('verified-wrapper');
        const verifiedTag = document.getElementById('verified-status-tag');
        
        if (currentPub.isVerified) {
            if (verifiedWrapper) verifiedWrapper.innerHTML = `<img src="https://l.top4top.io/p_37419yq8q0.png" class="verified-icon">`;
            if (verifiedTag) verifiedTag.innerHTML = `<p class="text-[9px] text-brand font-bold bg-brand/10 px-3 py-1.5 rounded-full tracking-widest uppercase shadow-sm">Verified Author</p>`;
        }

        updatePreview();
        switchCodeTab('html', 0);
    }

    // تحديث المعاينة الحية داخل الـ Iframe
    function updatePreview() {
        const isDark = document.documentElement.classList.contains('dark');
        const frame = document.getElementById('live-preview-frame');
        if (!frame) return;

        frame.srcdoc = `
            <!DOCTYPE html>
            <html class="${isDark ? 'dark' : ''}">
            <head>
                <script src="https://cdn.tailwindcss.com"><\/script>
                <style>
                    body { 
                        margin: 0; 
                        display: flex; 
                        justify-content: center; 
                        align-items: center; 
                        min-height: 100vh; 
                        background: transparent; 
                        transition: all 0.3s; 
                        color: ${isDark ? '#f8fafc' : '#0f172a'}; 
                    }
                    ${currentDesign.css}
                </style>
            </head>
            <body>${currentDesign.html}</body>
            </html>`;
    }
    
function highlightCode(code, type) {
    if (!code) return '';

    // تحويل الرموز الأساسية (Escaping)
    let output = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  if (type === 'html') {
    // 1. تقسيم الكود لعزل التاجات عن النصوص
    const parts = output.split(/(&lt;!--[\s\S]*?--&gt;|&lt;[\s\S]*?&gt;)/g);

    return parts.map(part => {
        if (!part) return '';

        // حالة التعليقات
        if (part.startsWith('&lt;!--')) {
            return `<span class="hl-comment">${part}</span>`;
        }
        
        // حالة التاجات
        if (part.startsWith('&lt;')) {
            return part.replace(/(&lt;\/?)([a-z0-9]+)|(\s[a-zA-Z0-9-]+)(?==)|(=)(".*?"|'.*?')|(\/?[&gt;]+)/gi, (match, p1, p2, p3, p4, p5, p6) => {
                if (p1) return `<span class="hl-tag">${p1}${p2}</span>`;
                if (p3) return ` <span class="hl-attr">${p3.trim()}</span>`;
                if (p4) return `<span class="hl-punct">${p4}</span><span class="hl-value">${p5}</span>`;
                if (p6) return `<span class="hl-tag">${p6}</span>`;
                return match;
            });
        }

        // --- التعديل السحري هنا ---
        // أي نص ليس تاجاً ولا تعليقاً، نغلفه بكلاس hl-text
        return `<span class="hl-text">${part}</span>`; 
    }).join('');
}

 else {
        // --- CSS PROFESSIONAL HIGHLIGHTING ---
        return output
            // 1. تلوين التعليقات أولاً
            .replace(/\/\*[\s\S]*?\*\//g, '<span class="hl-comment">$&</span>')
            
            // 2. تلوين المحددات (Selectors) - يشمل الـ Class, ID, Tags, والـ Hover
            // نبحث عن أي شيء قبل القوس { بشرط ألا يكون داخل بلوك الخصائص
            .replace(/^([^\{\}]+)(?=\s*\{)/gm, function(match) {
                return match.replace(/([\.#][a-zA-Z0-9_-]+)|(:\w+)|(::\w+)|([a-zA-Z0-9_-]+)/g, function(selector) {
                    if (selector.startsWith('.') || selector.startsWith('#')) return `<span class="hl-selector">${selector}</span>`;
                    if (selector.startsWith(':')) return `<span class="hl-selector">${selector}</span>`;
                    return `<span class="hl-tag">${selector}</span>`; // للتاجات مثل div, body
                });
            })

            // 3. تلوين الخصائص (Properties) - التي تنتهي بـ :
            .replace(/([a-zA-Z-]+)(?=\s*:)/g, '<span class="hl-property">$1</span>')

            // 4. تلوين القيم (Values) - التي بين : و ;
            .replace(/:\s*([^;\}]+)(?=[;\}])/g, '<span class="hl-punct">:</span> <span class="hl-value">$1</span>')

            // 5. تلوين الرموز
            .replace(/[\{\};]/g, '<span class="hl-punct">$&</span>');
    }
}

function switchCodeTab(mode, index) {
    const bg = document.getElementById('code-active-bg');
    const output = document.getElementById('code-output');
    if (!output || !currentDesign) return;

    // 1. تحريك المؤشر البنفسجي
    if (bg) {
        bg.style.transform = `translateX(${index * 100}%)`;
    }

    // 2. جلب الكود وتلوينه
    const rawCode = (mode === 'html') ? currentDesign.html : currentDesign.css;
    
    // إضافة تأثير "تلاشي" بسيط عند التبديل
    output.style.opacity = '0';
    
    setTimeout(() => {
        output.innerHTML = highlightCode(rawCode, mode);
        output.style.opacity = '1';
    }, 50);

    // 3. تحديث مظهر الأزرار بشكل احترافي
    const btns = {
        html: document.getElementById('btn-html'),
        css: document.getElementById('btn-css')
    };

    Object.keys(btns).forEach(key => {
        if (btns[key]) {
            if (key === mode) {
                btns[key].classList.add('text-white');
                btns[key].classList.remove('text-slate-400');
            } else {
                btns[key].classList.remove('text-white');
                btns[key].classList.add('text-slate-400');
            }
        }
    });
}

    // دالة نسخ الكود الكامل
    function copyFullCode() {
        const fullCode = `<style>\n${currentDesign.css}\n</style>\n${currentDesign.html}`;
        navigator.clipboard.writeText(fullCode).then(() => {
            const btn = document.getElementById('copy-btn');
            if (!btn) return;
            
            const originalText = btn.innerText;
            btn.innerText = 'Copied Successfully! ✅';
            btn.style.background = '#10b981';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = '#6336fa';
            }, 2000);
        });
    }

    // تشغيل الدالة عند تحميل النافذة
    window.onload = initPage;
</script>
