<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفتاح التحول السيبربانك - مقارنة التصميم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* الحاوية الرئيسية */
        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* تصميم طبقات الـ iFrames */
        .view-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* الموقع القديم (الافتراضي في البداية) */
        .layer-old {
            z-index: 1;
        }

        /* الموقع الجديد (مخفي خلف قناع دائري يبدأ بحجم 0) */
        .layer-new {
            z-index: 2;
            clip-path: circle(0% at 50% 80px); /* يبدأ من مكان الزر في الأعلى */
            transition: clip-path 0.8s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        /* عندما يتم تفعيل الموقع الجديد، تتسع الدائرة لتشمل الشاشة كاملة */
        .page-container.show-new .layer-new {
            clip-path: circle(150% at 50% 80px);
        }

        /* لوحة التحكم العلوية للزر */
        .control-panel {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        /* الزر المضيء (Cyberpunk Toggle) */
        .cyber-btn {
            pointer-events: auto;
            background: #121318;
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* تأثير التوهج عند الوقوف على الزر */
        .cyber-btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8), inset 0 0 15px rgba(255, 0, 85, 0.4);
            text-shadow: 0 0 5px #ff0055;
        }

        /* شكل الزر عندما ينتقل للوضع الجديد (يتحول للون النيون الأخضر) */
        .page-container.show-new .cyber-btn {
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4), inset 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .page-container.show-new .cyber-btn:hover {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8), inset 0 0 15px rgba(0, 255, 204, 0.4);
            text-shadow: 0 0 5px #00ffcc;
        }

        /* تأثير التشويش الرقمي الخاطف (Glitch Effect) */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 85, 0.1);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes glitch-anim {
            0% { opacity: 0; transform: translate(0); }
            20% { opacity: 0.8; background: rgba(0, 255, 204, 0.2); transform: translate(-5px, 5px); }
            40% { opacity: 0.5; background: rgba(255, 0, 85, 0.2); transform: translate(5px, -5px); }
            60% { opacity: 0.8; transform: translate(-2px, -2px); }
            80% { opacity: 0.3; transform: translate(2px, 2px); }
            100% { opacity: 0; transform: translate(0); }
        }

        .glitching {
            animation: glitch-anim 0.4s linear;
        }

        /* نصوص توضيحية جانبية للزر */
        .status-text {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="page-container" id="stage">
        
        <div class="control-panel">
            <button class="cyber-btn" id="toggleBtn">استكشف التصميم الجديد 🚀</button>
            <div class="status-text" id="statusText">الوضع الحالي: التصميم الأولي (v1.0)</div>
        </div>

        <div class="glitch-overlay" id="glitch"></div>

        <div class="view-layer layer-old">
            <iframe src="item/index.html" title="Old Design"></iframe>
        </div>

        <div class="view-layer layer-new">
            <iframe src="item/index2.html" title="New Design"></iframe>
        </div>

    </div>

    <script>
        const stage = document.getElementById('stage');
        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        const glitch = document.getElementById('glitch');

        // مصفوفة تحتوي على مؤثرات صوتية بسيطة مولدة برمجياً (لتجنب استدعاء ملفات خارجية)
        // اختيارية بالكامل وتعمل بمجرد تفاعل المستخدم مع المتصفح
        function playGlitchSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // الصوت الأول: صوت طنين خفيف (Beep)
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(120, audioCtx.currentTime); // تردد منخفض للـ Glitch
                oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("AudioContext is blocked or not supported yet.");
            }
        }

        toggleBtn.addEventListener('click', () => {
            // 1. تشغيل الأنميشن الخاص بالـ Glitch الرقمي الخاطف
            glitch.classList.add('glitching');
            playGlitchSound(); // تشغيل الصوت الرقمي التفاعلي

            // إزالة كلاس الأنميشن بعد انتهائه ليكون جاهزاً للمرة القادمة
            setTimeout(() => {
                glitch.classList.remove('glitching');
            }, 400);

            // 2. التبديل بين الحالات (تبديل كلاس show-new)
            const isNewShown = stage.classList.toggle('show-new');

            // 3. تحديث النصوص وشكل الأزرار بناءً على الحالة
            if (isNewShown) {
                toggleBtn.innerText = "العودة للتصميم الأولي 🕰️";
                statusText.innerText = "الوضع الحالي: التصميم الجديد (v2.0)";
                statusText.style.color = "#00ffcc";
            } else {
                toggleBtn.innerText = "استكشف التصميم الجديد 🚀";
                statusText.innerText = "الوضع الحالي: التصميم الأولي (v1.0)";
                statusText.style.color = "#ff0055";
            }
        });
    </script>
</body>
</html>
