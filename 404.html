<!DOCTYPE html>
<html lang="en" dir="ltr"> <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="48×48.png" sizes="48x48" type="image/png">
<link rel="icon" href="96×96.png" sizes="96x96" type="image/png">
<link rel="manifest" href="/manifest.json">

<link rel="stylesheet" href="header.css">  
<title>404 - Not Found</title>

<style>
/* Reset and Base Styles */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#ffffff; overflow-x:hidden; }

/* Wrapper and Box Styles */
.wrapper {
    max-width: 820px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* Copy Alert */
#copyAlert {
    position: fixed;
    bottom: 20px;
    left: 20px; /* Changed from right to left */
    background: #0a3ec2;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    opacity: 0;
    transition: 0.4s;
    font-size: 15px;
}

/* Share Buttons */
.share-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px auto;
    max-width: 820px;
}

        footer {
            background: #111;
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            border-radius: 4rem 4rem 0 0;
        }
        .dev-tag { color: var(--clr-white); text-decoration: none; font-weight: 800; }
/* ===== TOOLS MENU ===== */
.tools-menu {
    position: relative;
    font-weight: 700;
}

.tools-dropdown {
    position: absolute;
    top: 40px;
    left: 0; /* Changed from right to left for LTR */
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    width: 260px;
    display: none;
    flex-direction: column;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    z-index: 999;
}

.tools-dropdown a:hover {
    background: #f5f7ff;
}

.tools-dropdown a.active {
    background: #5D0BDE;
    color: #fff;
}

.tools-menu:hover .tools-dropdown {
    display: flex;
}
</style>
</head>

<body>
<div id="header-placeholder"></div>

<div class="wrapper" style="margin-top: 120px; min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center;">
    <div style="padding: 40px; max-width: 600px;">
        <h1 style="font-size: 120px; margin: 0; line-height: 1; background: linear-gradient(45deg, #5D0BDE, #8e2de2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: -5px;">
            404
        </h1>
        
        <div style="margin-top: -10px; margin-bottom: 30px;">
            <h2 style="font-size: 28px; color: #333; margin-bottom: 10px;">Page Not Found</h2>
            <p style="color: #666; font-size: 18px; line-height: 1.6;">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
        </div>

        <a href="https://ui.wuaze.com" style="
            display: inline-block;
            padding: 15px 35px;
            background: #5D0BDE;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 10px 20px rgba(93, 11, 222, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        " onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 15px 25px rgba(93, 11, 222, 0.3)'" 
           onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 20px rgba(93, 11, 222, 0.2)'">
            Back to Homepage
        </a>
    </div>
</div>

    <footer>
    <div style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 0.6rem;">UI WUAZE</div>
    <p>&copy; 2026 Design Lab | Developed by </p>
</footer>
<script>
// Header Loading Logic
function loadHeader() {
    fetch('headerpage.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            initMobileMenu();
        })
        .catch(err => console.error('Error loading header:', err));
}

function initMobileMenu() {
    const btn = document.getElementById('mobileMenuBtn');
    const nav = document.getElementById('mainNav');

    if (btn && nav) {
        btn.addEventListener('click', () => {
            nav.classList.toggle('active');
            const spans = btn.querySelectorAll('span');
            const isActive = nav.classList.contains('active');
            
            // Basic animation for hamburger
            spans[0].style.transform = isActive ? 'rotate(45deg) translate(5px, 6px)' : 'none';
            spans[1].style.opacity = isActive ? '0' : '1';
            spans[2].style.transform = isActive ? 'rotate(-45deg) translate(7px, -8px)' : 'none';
        });
    }
}

document.addEventListener('DOMContentLoaded', loadHeader);
</script>
<script src="App.js" type="text/javascript" charset="utf-8"></script>
</body>
</html>
